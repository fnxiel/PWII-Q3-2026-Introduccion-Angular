<h1>Artistas</h1>
<button (click)="notificacionesService.agregarNotificacion(
  'Notificacion desde Artistas',
  'Esta es una notificación desde la lista de artistas.',
  'info'
)">Notificar desde Canciones</button>
@for (artista of artistas; track $index) {
    <app-artista 
      [nombre]="artista.nombre" 
      [genero]="artista.genero" 
      [pais]="artista.pais" 
      [imagen]="artista.imagen"
      [biografia]="artista.biografia"
    ></app-artista>
}
